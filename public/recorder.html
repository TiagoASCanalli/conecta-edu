<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravador Automático de Vídeo .MP4 (60s / 1800 Frames) • ConectaEdu</title>
  <style>
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .recorder-panel {
      max-width: 1280px;
      width: 100%;
      text-align: center;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 8px;
    }
    .status-badge {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 9999px;
      background: #ef4444;
      color: white;
    }
    .status-badge.running {
      animation: pulse 1.5s infinite;
      background: #dc2626;
    }
    .status-badge.success {
      background: #059669;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .progress-bar-wrapper {
      background: #334155;
      height: 10px;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #0284c7, #10b981);
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }
    canvas {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      border-radius: 12px;
      border: 3px solid #334155;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .controls {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    .btn-red { background: #dc2626; }
    .btn-red:hover { background: #b91c1c; }
    .btn-green { background: #059669; }
    .btn-green:hover { background: #047857; }
    #logOutput {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="recorder-panel">
    <div class="header-bar">
      <div>
        <strong style="color: #38bdf8;">ConectaEdu • Gravador de Vídeo MP4 (Exatamente 60 Segundos)</strong>
        <div style="font-size: 0.75rem; color: #94a3b8;">
          Motor Web Worker Imune a Throttling • 1800 Frames a 30 FPS • Aluno + Curadora + PWA
        </div>
      </div>
      <div style="display: flex; gap: 14px; align-items: center;">
        <span class="status-badge running" id="recBadge">🔴 GRAVANDO FRAMES...</span>
        <strong style="font-family: monospace; font-size: 1.25rem; color: #f59e0b;" id="clockText">00:00 / 00:60</strong>
      </div>
    </div>

    <!-- Barra de Progresso Real dos 1800 Frames -->
    <div class="progress-bar-wrapper">
      <div class="progress-bar-fill" id="frameProgressFill"></div>
    </div>

    <!-- Canvas HD 1280x720 -->
    <canvas id="videoCanvas" width="1280" height="720"></canvas>

    <div class="controls">
      <button class="btn-green" id="btnStartNow" onclick="startRecordingNow()" style="display: none;">
        ▶ Iniciar Nova Gravação (1800 Frames / 60s)
      </button>
      <button class="btn-red" id="manualStopBtn" onclick="forceStopAndSave()">
        Finalizar e Salvar Vídeo Agora (.mp4)
      </button>
      <button onclick="window.location.reload()">↺ Reiniciar</button>
      <a href="/" style="color: #38bdf8; text-decoration: none; font-size: 0.88rem; margin-left: 10px;">➔ Ir para o ConectaEdu</a>
    </div>

    <div id="logOutput">
      Renderizando frame <span id="frameCountText">1</span> de 1800 (<span id="pctText">0%</span> concluído). Por favor, aguarde os 60 segundos completos...
    </div>
  </div>

  <script>
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1280;
    const H = 720;

    const fps = 30;
    const totalDuration = 60; // 60 segundos exatos
    const targetFrames = fps * totalDuration; // 1800 frames
    
    let frameCount = 0;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let chosenMimeType = 'video/mp4';
    let worker = null;

    // Roteiro Oficial Abrangendo TODOS os Módulos (Aluno + Curador + Mobile)
    const TIMELINE = [
      {
        start: 0,
        end: 8,
        module: "Abertura & Contexto",
        url: "https://conectaedu.senacsp.edu.br",
        speech: "Olá professor Anderson e colegas! Apresentamos a PoC funcional do ConectaEdu (Senac TADS), desenvolvida para eliminar o isolamento entre disciplinas teóricas e práticas."
      },
      {
        start: 8,
        end: 20,
        module: "Visão do Aluno • Busca & Teoria",
        url: "https://conectaedu.senacsp.edu.br/?q=Modelagem",
        speech: "Na visão do estudante Lucas Mendes: ao buscar 'Modelagem de Banco de Dados Relacional', o sistema exibe o conteúdo teórico curricular e o código SQL DDL das tabelas."
      },
      {
        start: 20,
        end: 32,
        module: "Visão do Aluno • Conteúdos Correlatos",
        url: "https://conectaedu.senacsp.edu.br/topicos/top_orm_web",
        speech: "Aqui o diferencial: o motor interdisciplinar recomenda 'Integração ORM em Aplicações Web', mostrando como as tabelas relacionais viram classes Prisma e endpoints na API Express!"
      },
      {
        start: 32,
        end: 42,
        module: "Visão do Aluno • Progresso & SQLite",
        url: "https://conectaedu.senacsp.edu.br/trilhas/trilha_fullstack_orm",
        speech: "Lucas acompanha seu ritmo: marca como 'Concluído', vê a barra de progresso atingir 100% no SQLite, favorita a trilha e compartilha o link com o grupo."
      },
      {
        start: 42,
        end: 54,
        module: "Visão da Curadora / Docente (Prof.ª Carla)",
        url: "https://conectaedu.senacsp.edu.br/curator.html",
        speech: "Na visão da Curadora Prof.ª Dra. Carla Silveira: ela acessa o painel docente para estruturar novas pontes no grafo e visualizar as conexões ativas entre as matérias."
      },
      {
        start: 54,
        end: 60,
        module: "Responsividade Mobile PWA & Conclusão",
        url: "https://conectaedu.senacsp.edu.br/mobile",
        speech: "Aplicação 100% responsiva para celulares com cache PWA offline. PoC plenamente comprovada e código no GitHub! Muito obrigado!"
      }
    ];

    // Detecção rigorosa de formato suportado
    function selectSupportedMime() {
      const candidates = [
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=h264',
        'video/webm;codecs=vp9',
        'video/webm'
      ];
      for (const t of candidates) {
        if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) {
          return t;
        }
      }
      return 'video/mp4';
    }

    // Inicialização ao carregar
    window.addEventListener('load', () => {
      // Inicia a gravação automaticamente
      startRecordingNow();
    });

    function startRecordingNow() {
      if (isRecording) return;
      document.getElementById('btnStartNow').style.display = 'none';
      document.getElementById('manualStopBtn').style.display = 'inline-block';
      document.getElementById('recBadge').className = 'status-badge running';
      document.getElementById('recBadge').innerText = '🔴 GRAVANDO FRAMES (00:00)...';

      chosenMimeType = selectSupportedMime();
      console.log('Iniciando gravação com MIME:', chosenMimeType);

      // 1. Stream puro do canvas (sem faixas de áudio desconectadas que travam o MediaRecorder)
      const stream = canvas.captureStream(fps);

      recordedChunks = [];
      try {
        mediaRecorder = new MediaRecorder(stream, { mimeType: chosenMimeType });
      } catch (e) {
        try {
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        } catch (e2) {
          mediaRecorder = new MediaRecorder(stream);
        }
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
          console.log(`Chunk recebido: ${e.data.size} bytes (Total chunks: ${recordedChunks.length})`);
        }
      };

      mediaRecorder.onstop = handleRecordingComplete;
      
      // Solicitar chunks a cada 1000ms para evitar estouro de buffer
      mediaRecorder.start(1000);
      isRecording = true;
      frameCount = 0;

      // 2. Web Worker Timer para evitar que o navegador congele o clock caso a aba perca o foco
      const workerCode = `
        let timer = null;
        self.onmessage = function(e) {
          if (e.data === 'start') {
            timer = setInterval(function() {
              self.postMessage('tick');
            }, 1000 / ${fps});
          } else if (e.data === 'stop') {
            clearInterval(timer);
          }
        };
      `;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      worker = new Worker(URL.createObjectURL(blob));

      worker.onmessage = function() {
        if (!isRecording) return;

        frameCount++;
        const currentSec = frameCount / fps;

        // Renderizar frame correspondente
        renderFrame(currentSec);

        // Atualizar interface
        const curSecInt = Math.floor(currentSec);
        const sStr = curSecInt < 10 ? '0' + curSecInt : curSecInt;
        document.getElementById('clockText').innerText = `00:${sStr} / 00:60`;
        document.getElementById('frameCountText').innerText = frameCount;

        const pct = Math.min(100, Math.round((frameCount / targetFrames) * 100));
        document.getElementById('pctText').innerText = pct + '%';
        document.getElementById('frameProgressFill').style.width = pct + '%';

        // Ao atingir os 1800 frames (60 segundos)
        if (frameCount >= targetFrames) {
          finishFullRecording();
        }
      };

      worker.postMessage('start');
    }

    function finishFullRecording() {
      if (!isRecording) return;
      isRecording = false;
      if (worker) worker.postMessage('stop');

      document.getElementById('recBadge').className = 'status-badge success';
      document.getElementById('recBadge').innerText = '✓ 1800 FRAMES CONCLUÍDOS!';
      document.getElementById('logOutput').innerHTML = '<strong style="color: #38bdf8;">Processando e finalizando arquivo .MP4...</strong>';
      
      mediaRecorder.stop();
    }

    function forceStopAndSave() {
      if (!isRecording) return;
      const curSec = Math.floor(frameCount / fps);
      if (curSec < 55) {
        if (!confirm(`Atenção: Você gravou apenas ${curSec} segundos dos 60 segundos totais. Deseja finalizar mesmo assim?`)) {
          return;
        }
      }
      finishFullRecording();
    }

    async function handleRecordingComplete() {
      const blob = new Blob(recordedChunks, { type: 'video/mp4' });
      const sizeMb = (blob.size / 1024 / 1024).toFixed(2);
      const totalSec = (frameCount / fps).toFixed(1);

      console.log(`Gravação finalizada: ${totalSec}s, ${blob.size} bytes`);

      // 1. Disparar download direto no navegador em .mp4
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = 'demonstracao_poc_1min.mp4';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => document.body.removeChild(a), 100);

      // 2. Upload para a API no backend para salvar em docs/
      try {
        const res = await fetch('/api/save-video?format=mp4', {
          method: 'POST',
          headers: { 'Content-Type': 'video/mp4' },
          body: blob
        });
        const result = await res.json();
        
        document.getElementById('logOutput').innerHTML = `
          <div style="background:#064e3b; color:#a7f3d0; padding:16px; border-radius:8px; font-size:1.05rem; margin-top:10px; line-height: 1.6;">
            🎉 <strong>VÍDEO DE 60 SEGUNDOS GERADO E SALVO COM SUCESSO!</strong><br>
            • Duração exata: <strong>${totalSec} segundos (${frameCount} frames)</strong><br>
            • Formato: <strong>MPEG-4 (.MP4)</strong> (${sizeMb} MB)<br>
            • Salvo no projeto em: <code>conecta-edu/docs/demonstracao_poc_1min.mp4</code><br>
            • Arquivo baixado automaticamente para a pasta de Downloads do seu Mac!<br>
            • Explora 100% dos módulos: <strong>Aluno (Lucas) + Curadora (Carla) + Mobile PWA</strong>.
          </div>
        `;
        document.getElementById('manualStopBtn').style.display = 'none';
        document.getElementById('btnStartNow').style.display = 'inline-block';
      } catch (err) {
        console.error('Erro ao enviar vídeo à API:', err);
      }
    }

    // =========================================================================
    // RENDERIZADOR GRÁFICO HD (1280x720)
    // =========================================================================
    function renderFrame(sec) {
      // Fundo Base
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);

      const step = TIMELINE.find(s => sec >= s.start && sec < s.end) || TIMELINE[0];

      // Barra de Navegador Superior Simulada
      renderBrowserHeader(step.url, step.module);

      // Renderização do Conteúdo de Acordo com a Etapa
      if (sec < 8) {
        renderScene1_Intro(sec);
      } else if (sec < 20) {
        renderScene2_AlunoBusca(sec);
      } else if (sec < 32) {
        renderScene3_AlunoCorrelatos(sec);
      } else if (sec < 42) {
        renderScene4_AlunoProgresso(sec);
      } else if (sec < 54) {
        renderScene5_CuradorCarla(sec);
      } else {
        renderScene6_MobileConclusao(sec);
      }

      // Cursor de Mouse animado
      renderMouseCursor(sec);

      // Sublegendas sincronizadas na base
      renderSubtitles(step);

      // Barra de Progresso no topo
      const pct = (sec / totalDuration) * W;
      ctx.fillStyle = '#f26522';
      ctx.fillRect(0, 48, pct, 3);
    }

    // Cabeçalho de Navegador com URL ativa
    function renderBrowserHeader(url, moduleName) {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, W, 48);

      // Botões da janela (macOS)
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(20, 24, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath(); ctx.arc(38, 24, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#10b981';
      ctx.beginPath(); ctx.arc(56, 24, 6, 0, Math.PI * 2); ctx.fill();

      // Barra de Endereço URL
      ctx.fillStyle = '#0f172a';
      roundRect(ctx, 80, 10, 520, 28, 14, true);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px monospace';
      ctx.fillText('🔒 ' + url, 95, 28);

      // Nome do Módulo em Destaque
      ctx.fillStyle = '#f26522';
      roundRect(ctx, W - 380, 10, 360, 28, 14, true);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px system-ui';
      ctx.fillText('▶ ' + moduleName, W - 365, 28);
    }

    // 1. Abertura Institucional (00-08s)
    function renderScene1_Intro(sec) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 15px system-ui';
      ctx.fillText('CENTRO UNIVERSITÁRIO SENAC SP • TADS 2026', W / 2, 110);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 44px system-ui';
      ctx.fillText('ConectaEdu • Prova de Conceito', W / 2, 165);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '18px system-ui';
      ctx.fillText('Plataforma de Aprendizado Dinâmico e Interdisciplinar', W / 2, 205);

      // Card da Equipe
      ctx.fillStyle = '#1e293b';
      roundRect(ctx, W / 2 - 420, 245, 840, 190, 14, true);
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5;
      roundRect(ctx, W / 2 - 420, 245, 840, 190, 14, false);

      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 14px system-ui';
      ctx.fillText('EQUIPE DE DESENVOLVIMENTO', W / 2, 280);

      const team = [
        { name: "Jonathan da Silva", role: "Backend & APIs" },
        { name: "Renan Duarte", role: "Banco SQLite" },
        { name: "Tiago Canalli", role: "Full-Stack & UI" },
        { name: "Vanessa Kolbe", role: "Qualidade & Testes" }
      ];
      team.forEach((m, i) => {
        const x = W / 2 - 315 + (i * 210);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 15px system-ui'; ctx.fillText(m.name, x, 335);
        ctx.fillStyle = '#94a3b8'; ctx.font = '12px system-ui'; ctx.fillText(m.role, x, 360);
      });

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'italic 13px system-ui';
      ctx.fillText('Orientador: Prof. Msc. Anderson Clayton Garcia Lopes', W / 2, 410);
      ctx.textAlign = 'left';
    }

    // 2. Módulo Aluno: Busca & Teoria (08-20s)
    function renderScene2_AlunoBusca(sec) {
      renderAppNavbar('Lucas Mendes', 'Aluno ADS • 3º Período', '👨‍💻');

      // Barra de busca interativa
      ctx.fillStyle = '#1e293b';
      roundRect(ctx, 60, 125, W - 120, 52, 26, true);
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5;
      roundRect(ctx, 60, 125, W - 120, 52, 26, false);

      ctx.font = '20px system-ui';
      ctx.fillText('🔍', 80, 158);

      const fullTxt = "Modelagem de Banco de Dados Relacional";
      const p = Math.min(1, (sec - 8) / 3.5);
      const sub = fullTxt.substring(0, Math.floor(p * fullTxt.length));
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 17px system-ui';
      ctx.fillText(sub + (Math.floor(sec * 4) % 2 === 0 ? '|' : ''), 115, 158);

      // Col 1: Tópicos
      ctx.fillStyle = '#1e293b';
      roundRect(ctx, 60, 195, 270, 360, 10, true);
      ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 12px system-ui';
      ctx.fillText('TÓPICOS DO CURSO', 80, 225);

      const items = [
        { t: "Modelagem Relacional", s: "A Fazer", active: true },
        { t: "Integração ORM", s: "A Fazer", active: false },
        { t: "APIs RESTful", s: "A Fazer", active: false },
        { t: "Padrões MVC", s: "A Fazer", active: false }
      ];
      items.forEach((it, i) => {
        const y = 245 + (i * 70);
        ctx.fillStyle = it.active ? '#0369a1' : '#334155';
        roundRect(ctx, 75, y, 240, 56, 8, true);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px system-ui';
        ctx.fillText(it.t, 88, y + 25);
        ctx.fillStyle = '#94a3b8'; ctx.font = '11px system-ui';
        ctx.fillText('Status: ' + it.s, 88, y + 43);
      });

      // Col 2: Detalhe Teórico & Código SQL
      ctx.fillStyle = '#1e293b';
      roundRect(ctx, 350, 195, 520, 360, 10, true);
      ctx.fillStyle = '#0284c7'; roundRect(ctx, 375, 215, 75, 22, 6, true);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px system-ui'; ctx.fillText('TADS301', 386, 230);

      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px system-ui';
      ctx.fillText('Modelagem de Banco de Dados Relacional', 375, 265);

      ctx.fillStyle = '#cbd5e1'; ctx.font = '13px system-ui';
      ctx.fillText('Conceito Teórico: Formas Normais (1FN, 2FN, 3FN), cardinalidade 1:N e chaves.', 375, 295);

      // Bloco de Código SQL
      ctx.fillStyle = '#0f172a';
      roundRect(ctx, 375, 315, 470, 140, 8, true);
      ctx.fillStyle = '#38bdf8'; ctx.font = '12px monospace';
      ctx.fillText('-- DDL SQL ANSI Relacional', 395, 340);
      ctx.fillStyle = '#f8fafc';
      ctx.fillText('CREATE TABLE alunos (', 395, 368);
      ctx.fillText('  id INT PRIMARY KEY AUTO_INCREMENT,', 395, 392);
      ctx.fillText('  nome VARCHAR(100) NOT NULL, email VARCHAR(120));', 395, 416);

      // Col 3: Dúvida de Lucas
      ctx.fillStyle = '#f59e0b';
      roundRect(ctx, 890, 195, 330, 360, 10, true);
      ctx.fillStyle = '#78350f'; ctx.font = 'bold 16px system-ui';
      ctx.fillText('🤔 Dúvida da Persona:', 915, 235);
      ctx.font = 'italic 14px system-ui';
      ctx.fillText('"Como esse CREATE TABLE relacional', 915, 275);
      ctx.fillText('se conecta com as APIs que estou', 915, 305);
      ctx.fillText('criando na outra matéria?"', 915, 335);
      ctx.fillStyle = '#b45309'; ctx.font = 'bold 13px system-ui';
      ctx.fillText('➔ Acionando recomendação...', 915, 400);
    }

    // 3. Módulo Aluno: Conteúdos Correlatos (20-32s)
    function renderScene3_AlunoCorrelatos(sec) {
      renderAppNavbar('Lucas Mendes', 'Aluno ADS • 3º Período', '👨‍💻');

      // Painel Dividido: Origem Teórica vs Destino Prático
      ctx.fillStyle = '#1e293b';
      roundRect(ctx, 60, 120, 520, 440, 12, true);
      ctx.fillStyle = '#0284c7'; ctx.font = 'bold 14px system-ui';
      ctx.fillText('TEORIA ISOLADA: BANCO DE DADOS', 85, 155);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px system-ui';
      ctx.fillText('Tabelas e Chaves Estrangeiras (SQL)', 85, 190);

      ctx.fillStyle = '#0f172a';
      roundRect(ctx, 85, 220, 470, 300, 8, true);
      ctx.fillStyle = '#38bdf8'; ctx.font = '12px monospace';
      ctx.fillText('-- Esquema Relacional DDL', 105, 255);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText('CREATE TABLE alunos (', 105, 290);
      ctx.fillText('  id INT PRIMARY KEY,', 105, 320);
      ctx.fillText('  nome VARCHAR(100) NOT NULL', 105, 350);
      ctx.fillText(');', 105, 380);

      // Conector Interdisciplinar Central
      ctx.fillStyle = '#f26522';
      ctx.font = 'bold 36px system-ui';
      ctx.fillText('➔', 605, 330);

      // Card do Conteúdo Correlato (O Diferencial da PoC)
      ctx.fillStyle = '#1e293b';
      roundRect(ctx, 660, 120, 560, 440, 12, true);
      ctx.strokeStyle = '#f26522'; ctx.lineWidth = 3.5;
      roundRect(ctx, 660, 120, 560, 440, 12, false);

      ctx.fillStyle = '#f26522'; ctx.font = 'bold 13px system-ui';
      ctx.fillText('🔗 CONTEÚDO CORRELATO RECOMENDADO', 690, 155);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px system-ui';
      ctx.fillText('Integração ORM em Aplicações Web', 690, 190);

      ctx.fillStyle = '#fef08a'; ctx.font = '13px system-ui';

    function drawField(x, y, w, label, val) {
      ctx.fillStyle = '#94a3b8'; ctx.font = '11px system-ui';
      ctx.fillText(label, x, y);
      ctx.fillStyle = '#0f172a';
      roundRect(ctx, x, y + 6, w, 32, 6, true);
      ctx.fillStyle = '#ffffff'; ctx.font = '12px system-ui';
      ctx.fillText(val, x + 12, y + 27);
    }

    function renderMouseCursor(sec) {
      let mx = 400, my = 300;
      if (sec < 20) {
        mx = 200 + Math.sin(sec * 2) * 50;
        my = 150 + Math.cos(sec * 2) * 10;
      } else if (sec < 32) {
        mx = 940; my = 505; // Clicando em Explorar Conexão Prática
      } else if (sec < 42) {
        mx = 550; my = 262; // Clicando em Concluído
      } else if (sec < 54) {
        mx = 330; my = 502; // Clicando em Salvar Conexão Curador
      } else {
        mx = W / 2; my = 200;
      }

      ctx.fillStyle = '#f26522';
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx + 16, my + 16);
      ctx.lineTo(mx + 6, my + 16);
      ctx.lineTo(mx, my + 24);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
    }

    function renderSubtitles(step) {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      roundRect(ctx, 50, H - 75, W - 100, 62, 8, true);
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5;
      roundRect(ctx, 50, H - 75, W - 100, 62, 8, false);

      ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 11px system-ui';
      ctx.fillText(`LOCUÇÃO [${step.module.toUpperCase()}]:`, 70, H - 54);

      ctx.fillStyle = '#ffffff'; ctx.font = '14px system-ui';
      ctx.fillText(`"${step.speech}"`, 70, H - 28);
    }

    function roundRect(ctx, x, y, width, height, radius, fill) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y + width, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      else ctx.stroke();
    }
